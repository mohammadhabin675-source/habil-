<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Racer 2D - Game Balapan</title>
    <!-- Tailwind CSS untuk styling UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            overflow: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Neon Glow Effects */
        .neon-border {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5), inset 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .neon-btn {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
            transition: all 0.2s ease;
        }

        .neon-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9);
        }

        /* Control Button Style */
        .touch-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(4px);
        }
        
        .touch-btn:active {
            background: rgba(56, 189, 248, 0.4);
            border-color: #38bdf8;
        }

        /* Custom Scrollbar for Modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #06b6d4;
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-2 sm:p-4 bg-slate-950">

    <!-- Container Utama Game -->
    <div class="relative w-full max-w-md h-full max-h-[850px] flex flex-col items-center justify-between bg-slate-900 rounded-3xl overflow-hidden border-2 border-cyan-500/40 neon-border">
        
        <!-- Dashboard Top UI -->
        <div class="w-full bg-slate-900/90 backdrop-blur-md px-4 py-2 border-b border-cyan-500/30 flex items-center justify-between z-10">
            <!-- Speedometer -->
            <div class="flex flex-col">
                <span class="text-xs text-cyan-400 font-semibold tracking-wider">KECEPATAN</span>
                <div class="flex items-baseline gap-1">
                    <span id="speedVal" class="text-2xl font-bold font-orbitron text-cyan-300">0</span>
                    <span class="text-xs text-slate-400">KM/H</span>
                </div>
            </div>

            <!-- Coin Count -->
            <div class="flex items-center gap-1.5 bg-slate-800/80 px-3 py-1 rounded-full border border-yellow-500/30">
                <i class="fa-solid font-bold fa-coins text-yellow-400 text-sm"></i>
                <span id="coinVal" class="text-lg font-orbitron font-bold text-yellow-300">0</span>
            </div>

            <!-- Score & High Score -->
            <div class="flex flex-col items-end">
                <span class="text-xs text-pink-400 font-semibold tracking-wider">SKOR</span>
                <span id="scoreVal" class="text-2xl font-bold font-orbitron text-pink-400">0</span>
                <span class="text-[10px] text-slate-400">BEST: <span id="highScoreVal" class="text-slate-200">0</span></span>
            </div>
        </div>

        <!-- Canvas Utama Permainan -->
        <div class="relative flex-1 w-full h-full flex items-center justify-center overflow-hidden">
            <canvas id="gameCanvas" class="w-full h-full block bg-slate-950"></canvas>

            <!-- Sound Toggle Button -->
            <button id="soundToggle" class="absolute top-3 right-3 bg-slate-800/80 border border-cyan-500/40 text-cyan-400 p-2.5 rounded-full z-20 hover:bg-slate-700 transition">
                <i id="soundIcon" class="fa-solid fa-volume-high text-sm"></i>
            </button>

            <!-- Active Powerup Indicators -->
            <div id="powerupBadge" class="absolute top-3 left-3 flex flex-col gap-1 z-20"></div>

            <!-- Overlay Start Game -->
            <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-30">
                <div class="w-16 h-16 bg-cyan-500/20 border-2 border-cyan-400 rounded-2xl flex items-center justify-center mb-4 text-cyan-400 text-3xl shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <h1 class="text-3xl font-black font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 mb-2">NEON RACER</h1>
                <p class="text-xs text-slate-400 mb-6 max-w-[250px]">Kendalikan mobil neonmu, hindari lalu lintas, dan kumpulkan koin sebanyak mungkin!</p>

                <!-- Tombol Mulai -->
                <button id="startBtn" class="neon-btn w-full max-w-[200px] py-3.5 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-orbitron font-bold rounded-xl text-lg tracking-wider transition-all cursor-pointer mb-6">
                    MULAI MAIN
                </button>

                <!-- Instructions -->
                <div class="text-xs text-slate-400 bg-slate-900/80 p-3 rounded-xl border border-slate-800 w-full max-w-[240px]">
                    <p class="font-bold text-slate-300 mb-1">KONTROL:</p>
                    <p>⌨️ Keyboard: <span class="text-cyan-400">Panah / WASD</span></p>
                    <p>📱 Mobile: <span class="text-cyan-400">Tombol Layar Sentuh</span></p>
                </div>
            </div>

            <!-- Overlay Game Over -->
            <div id="gameOverOverlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-30">
                <div class="w-16 h-16 bg-red-500/20 border-2 border-red-500 rounded-2xl flex items-center justify-center mb-3 text-red-500 text-3xl animate-bounce">
                    <i class="fa-solid fa-burst"></i>
                </div>
                <h2 class="text-3xl font-black font-orbitron text-red-500 mb-1">TABRAKAN!</h2>
                <p class="text-xs text-slate-400 mb-4">Mobilmu hancur di jalanan neon.</p>

                <div class="w-full max-w-[240px] bg-slate-900/80 border border-slate-800 rounded-xl p-4 mb-6 space-y-2">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Skor Akhir:</span>
                        <span id="finalScore" class="font-orbitron font-bold text-pink-400 text-lg">0</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Koin Diperoleh:</span>
                        <span id="finalCoins" class="font-orbitron font-bold text-yellow-400 text-lg">0</span>
                    </div>
                    <div class="border-t border-slate-800 pt-2 flex justify-between items-center text-sm">
                        <span class="text-slate-400">Skor Tertinggi:</span>
                        <span id="finalHighScore" class="font-orbitron font-bold text-cyan-400">0</span>
                    </div>
                </div>

                <button id="restartBtn" class="neon-btn w-full max-w-[200px] py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-orbitron font-bold rounded-xl text-lg tracking-wider transition-all cursor-pointer">
                    MAIN LAGI
                </button>
            </div>
        </div>

        <!-- Touch Controls Layout (Mobile/Tablet On-Screen Buttons) -->
        <div class="w-full bg-slate-950/90 border-t border-cyan-500/20 p-3 grid grid-cols-3 gap-2 z-10">
            <!-- Tombol Kiri -->
            <button id="btnLeft" class="touch-btn h-14 rounded-xl flex items-center justify-center text-cyan-400 text-xl font-bold active:scale-95 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <!-- Up / Down Control stacked -->
            <div class="grid grid-rows-2 gap-1.5 h-14">
                <button id="btnUp" class="touch-btn rounded-lg flex items-center justify-center text-emerald-400 text-xs font-bold active:scale-95 transition">
                    <i class="fa-solid fa-angles-up mr-1"></i> GAS
                </button>
                <button id="btnDown" class="touch-btn rounded-lg flex items-center justify-center text-rose-400 text-xs font-bold active:scale-95 transition">
                    <i class="fa-solid fa-angles-down mr-1"></i> REM
                </button>
            </div>

            <!-- Tombol Kanan -->
            <button id="btnRight" class="touch-btn h-14 rounded-xl flex items-center justify-center text-cyan-400 text-xl font-bold active:scale-95 transition">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Script Game Engine -->
    <script>
        // Setup Canvas & Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Elements UI
        const speedValEl = document.getElementById('speedVal');
        const coinValEl = document.getElementById('coinVal');
        const scoreValEl = document.getElementById('scoreVal');
        const highScoreValEl = document.getElementById('highScoreVal');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        const finalCoinsEl = document.getElementById('finalCoins');
        finalHighScoreEl = document.getElementById('finalHighScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const soundToggleBtn = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');
        const powerupBadgeEl = document.getElementById('powerupBadge');

        // Responsif Canvas Adjust
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game State Variables
        let isPlaying = false;
        let score = 0;
        let coinsCollected = 0;
        let highScore = localStorage.getItem('neon_racer_highscore') || 0;
        highScoreValEl.textContent = Math.floor(highScore);

        let speed = 5;
        let maxSpeed = 16;
        let minSpeed = 3;
        let baseSpeed = 6;
        let distance = 0;

        // Web Audio Synthesizer Engine
        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'powerup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {
                console.log("Audio Error:", e);
            }
        }

        // Toggle Sound
        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "fa-solid fa-volume-high text-sm";
                soundToggleBtn.classList.remove('text-slate-500');
                soundToggleBtn.classList.add('text-cyan-400');
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-sm";
                soundToggleBtn.classList.remove('text-cyan-400');
                soundToggleBtn.classList.add('text-slate-500');
            }
        });

        // Kontrol Input User
        const keys = {
            left: false,
            right: false,
            up: false,
            down: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
        });

        // Event listener kontrol sentuh (Mobile Buttons)
        function bindTouchBtn(btnId, keyName) {
            const btn = document.getElementById(btnId);
            const startEvent = (e) => { e.preventDefault(); keys[keyName] = true; };
            const endEvent = (e) => { e.preventDefault(); keys[keyName] = false; };

            btn.addEventListener('touchstart', startEvent, { passive: false });
            btn.addEventListener('touchend', endEvent, { passive: false });
            btn.addEventListener('mousedown', startEvent);
            btn.addEventListener('mouseup', endEvent);
            btn.addEventListener('mouseleave', endEvent);
        }

        bindTouchBtn('btnLeft', 'left');
        bindTouchBtn('btnRight', 'right');
        bindTouchBtn('btnUp', 'up');
        bindTouchBtn('btnDown', 'down');

        // Player Mobil
        class Player {
            constructor() {
                this.width = 42;
                this.height = 75;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - this.height - 30;
                this.speedX = 0;
                this.maxSpeedX = 6;
                this.shield = false;
                this.shieldTimer = 0;
                this.boost = false;
                this.boostTimer = 0;
            }

            draw() {
                ctx.save();

                // Shield Effect Visual
                if (this.shield) {
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.height * 0.65, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00f0ff';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                }

                // Turbo Exhaust Flame
                if (keys.up || this.boost) {
                    ctx.fillStyle = this.boost ? '#e11d48' : '#f59e0b';
                    ctx.shadowColor = this.boost ? '#f43f5e' : '#fbbf24';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.moveTo(this.x + 10, this.y + this.height);
                    ctx.lineTo(this.x + this.width / 2, this.y + this.height + (this.boost ? 25 : 15) + Math.random() * 5);
                    ctx.lineTo(this.x + this.width - 10, this.y + this.height);
                    ctx.closePath();
                    ctx.fill();
                }

                // Car Body Shadow / Glow
                ctx.shadowColor = '#ec4899';
                ctx.shadowBlur = 12;

                // Main Body
                ctx.fillStyle = '#1e1b4b';
                ctx.strokeStyle = '#ec4899';
                ctx.lineWidth = 2;
                
                // Rounded Rect Body
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 8);
                ctx.fill();
                ctx.stroke();

                // Car Roof Lines & Accent
                ctx.fillStyle = '#ec4899';
                ctx.fillRect(this.x + 6, this.y + 18, this.width - 12, this.height - 35);

                // Windshield
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 8;
                ctx.fillRect(this.x + 8, this.y + 12, this.width - 16, 12);
                ctx.fillRect(this.x + 10, this.y + this.height - 22, this.width - 20, 8);

                // Headlights
                ctx.fillStyle = '#fef08a';
                ctx.shadowColor = '#fef08a';
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x + 4, this.y + 2, 8, 4);
                ctx.fillRect(this.x + this.width - 12, this.y + 2, 8, 4);

                // Wheels
                ctx.fillStyle = '#0f172a';
                ctx.shadowBlur = 0;
                ctx.fillRect(this.x - 3, this.y + 8, 4, 14);
                ctx.fillRect(this.x + this.width - 1, this.y + 8, 4, 14);
                ctx.fillRect(this.x - 3, this.y + this.height - 22, 4, 14);
                ctx.fillRect(this.x + this.width - 1, this.y + this.height - 22, 4, 14);

                ctx.restore();
            }

            update(roadLeft, roadRight) {
                // Penanganan pergerakan horizontal yang independen dari posisi batas
                if (keys.left && keys.right) {
                    this.speedX = 0;
                } else if (keys.left) {
                    this.speedX = -this.maxSpeedX;
                } else if (keys.right) {
                    this.speedX = this.maxSpeedX;
                } else {
                    this.speedX *= 0.8; // Gesekan halus saat tidak ada input tombol
                }

                // Terapkan kecepatan ke posisi horizontal
                this.x += this.speedX;

                // Batas minimal dan maksimal posisi X di dalam area jalan
                const minX = roadLeft + 2;
                const maxX = roadRight - this.width - 2;

                // Pembatasan presisi (Clamp): mencegah tersangkut dan memastikan mobil bisa langsung belok sebaliknya
                if (this.x < minX) {
                    this.x = minX;
                    if (this.speedX < 0) this.speedX = 0;
                } else if (this.x > maxX) {
                    this.x = maxX;
                    if (this.speedX > 0) this.speedX = 0;
                }

                // Powerup Timers
                if (this.shield) {
                    this.shieldTimer--;
                    if (this.shieldTimer <= 0) this.shield = false;
                }

                if (this.boost) {
                    this.boostTimer--;
                    if (this.boostTimer <= 0) this.boost = false;
                }
            }
        }

        // Enemy Vehicles
        class Enemy {
            constructor(roadLeft, roadRight) {
                this.width = 40;
                this.height = 70;
                const laneWidth = (roadRight - roadLeft) / 3;
                const lane = Math.floor(Math.random() * 3);
                this.x = roadLeft + lane * laneWidth + (laneWidth - this.width) / 2;
                this.y = -this.height - Math.random() * 100;
                this.speedOffset = Math.random() * 2 - 1; // Kecepatan relatif beda-beda

                // Random Neon Palette Color
                const colors = [
                    { body: '#0284c7', glow: '#38bdf8' }, // Blue
                    { body: '#16a34a', glow: '#4ade80' }, // Green
                    { body: '#9333ea', glow: '#c084fc' }, // Purple
                    { body: '#ea580c', glow: '#fb923c' }  // Orange
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                ctx.save();
                ctx.shadowColor = this.color.glow;
                ctx.shadowBlur = 10;

                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = this.color.glow;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                ctx.fill();
                ctx.stroke();

                // Roof Detail
                ctx.fillStyle = this.color.body;
                ctx.fillRect(this.x + 6, this.y + 15, this.width - 12, this.height - 30);

                // Windshield
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(this.x + 8, this.y + this.height - 20, this.width - 16, 8);

                // Tail lights
                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 8;
                ctx.fillRect(this.x + 4, this.y + this.height - 4, 8, 3);
                ctx.fillRect(this.x + this.width - 12, this.y + this.height - 4, 8, 3);

                ctx.restore();
            }

            update(gameSpeed) {
                this.y += gameSpeed + this.speedOffset;
            }
        }

        // Collectible Items (Coins & Powerups)
        class Item {
            constructor(roadLeft, roadRight, type) {
                this.type = type; // 'coin', 'shield', 'turbo'
                this.size = 22;
                const laneWidth = (roadRight - roadLeft) / 3;
                const lane = Math.floor(Math.random() * 3);
                this.x = roadLeft + lane * laneWidth + laneWidth / 2;
                this.y = -this.size - Math.random() * 150;
                this.rotation = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'coin') {
                    this.rotation += 0.05;
                    ctx.scale(Math.sin(this.rotation), 1); // Spinning coin effect

                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#eab308';
                    ctx.shadowColor = '#fde047';
                    ctx.shadowBlur = 12;
                    ctx.fill();

                    ctx.strokeStyle = '#fef08a';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (this.type === 'shield') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2 + 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#0284c7';
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 12;
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '900 12px FontAwesome';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('S', 0, 0);
                } else if (this.type === 'turbo') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2 + 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#e11d48';
                    ctx.shadowColor = '#f43f5e';
                    ctx.shadowBlur = 12;
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '900 12px font-orbitron';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('T', 0, 0);
                }

                ctx.restore();
            }

            update(gameSpeed) {
                this.y += gameSpeed;
            }
        }

        // Environment Details (Road & Dashed Lines)
        let roadOffsetY = 0;
        function drawRoad() {
            const roadWidth = Math.min(canvas.width * 0.82, 360);
            const roadLeft = (canvas.width - roadWidth) / 2;
            const roadRight = roadLeft + roadWidth;

            // Background Side Grass/Cyber-Grid
            ctx.fillStyle = '#050811';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Side Neon Border Strip
            ctx.fillStyle = '#06b6d4';
            ctx.shadowColor = '#06b6d4';
            ctx.shadowBlur = 15;
            ctx.fillRect(roadLeft - 6, 0, 6, canvas.height);
            ctx.fillRect(roadRight, 0, 6, canvas.height);

            // Main Road Asphalt
            ctx.fillStyle = '#0f172a';
            ctx.shadowBlur = 0;
            ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

            // Animated Dashed Lane Dividers
            roadOffsetY = (roadOffsetY + speed) % 40;
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffsetY;

            // Lane 1 Divider
            ctx.beginPath();
            ctx.moveTo(roadLeft + roadWidth / 3, 0);
            ctx.lineTo(roadLeft + roadWidth / 3, canvas.height);
            ctx.stroke();

            // Lane 2 Divider
            ctx.beginPath();
            ctx.moveTo(roadLeft + (roadWidth / 3) * 2, 0);
            ctx.lineTo(roadLeft + (roadWidth / 3) * 2, canvas.height);
            ctx.stroke();

            ctx.setLineDash([]); // Reset line dash

            return { roadLeft, roadRight, roadWidth };
        }

        // Entities arrays
        let player = new Player();
        let enemies = [];
        let items = [];

        // Game Initialization / Reset
        function resetGame() {
            player = new Player();
            enemies = [];
            items = [];
            score = 0;
            coinsCollected = 0;
            speed = baseSpeed;
            distance = 0;
            updateUI();
        }

        function updateUI() {
            let currentDisplaySpeed = player.boost ? speed * 18 : speed * 12;
            speedValEl.textContent = Math.floor(currentDisplaySpeed);
            coinValEl.textContent = coinsCollected;
            scoreValEl.textContent = Math.floor(score);

            // Powerup badges
            powerupBadgeEl.innerHTML = '';
            if (player.shield) {
                powerupBadgeEl.innerHTML += `<span class="bg-cyan-500/80 text-white text-[10px] font-bold px-2 py-0.5 rounded-full border border-cyan-300 backdrop-blur-sm shadow-md">SHIELD</span>`;
            }
            if (player.boost) {
                powerupBadgeEl.innerHTML += `<span class="bg-rose-500/80 text-white text-[10px] font-bold px-2 py-0.5 rounded-full border border-rose-300 backdrop-blur-sm shadow-md">TURBO</span>`;
            }
        }

        // Collision Detection Utility
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function checkCircleCollision(rect, circle) {
            const distX = Math.abs(circle.x - rect.x - rect.width / 2);
            const distY = Math.abs(circle.y - rect.y - rect.height / 2);

            if (distX > (rect.width / 2 + circle.size / 2)) return false;
            if (distY > (rect.height / 2 + circle.size / 2)) return false;

            return true;
        }

        // Main Game Loop
        let lastTime = performance.now();
        function gameLoop(currentTime) {
            if (!isPlaying) return;

            // Frame Delta Adjust
            const delta = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Environment Road
            const { roadLeft, roadRight } = drawRoad();

            // Calculate Speed based on Key Accelerate/Brake & Turbo
            if (player.boost) {
                speed = maxSpeed + 4;
            } else if (keys.up) {
                speed = Math.min(speed + 0.1, maxSpeed);
            } else if (keys.down) {
                speed = Math.max(speed - 0.15, minSpeed);
            } else {
                // Return to base speed gradually
                if (speed < baseSpeed) speed += 0.05;
                if (speed > baseSpeed) speed -= 0.05;
            }

            // Gradually Increase Difficulty (Base Speed) over time
            baseSpeed = 6 + Math.min(score / 1500, 6);

            // Score increment
            score += speed * 0.1;
            updateUI();

            // Spawn Enemies
            if (Math.random() < 0.02 + (baseSpeed * 0.002) && enemies.length < 5) {
                enemies.push(new Enemy(roadLeft, roadRight));
            }

            // Spawn Items (Coins & Powerups)
            if (Math.random() < 0.015 && items.length < 3) {
                const rand = Math.random();
                let type = 'coin';
                if (rand > 0.85) type = 'shield';
                else if (rand > 0.7) type = 'turbo';
                items.push(new Item(roadLeft, roadRight, type));
            }

            // Update & Draw Items
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.update(speed);
                item.draw();

                // Item Collision
                if (checkCircleCollision(player, item)) {
                    if (item.type === 'coin') {
                        coinsCollected += 1;
                        score += 50;
                        playSound('coin');
                    } else if (item.type === 'shield') {
                        player.shield = true;
                        player.shieldTimer = 300; // ~5 Seconds
                        playSound('powerup');
                    } else if (item.type === 'turbo') {
                        player.boost = true;
                        player.boostTimer = 180; // ~3 Seconds
                        playSound('powerup');
                    }
                    items.splice(i, 1);
                    continue;
                }

                // Remove off-screen items
                if (item.y > canvas.height + 50) {
                    items.splice(i, 1);
                }
            }

            // Update & Draw Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.update(speed);
                enemy.draw();

                // Enemy Collision Check
                if (checkCollision(player, enemy)) {
                    if (player.shield) {
                        // Shield absorbs impact
                        player.shield = false;
                        enemies.splice(i, 1);
                        playSound('crash');
                    } else {
                        // Game Over Condition
                        handleGameOver();
                        return;
                    }
                }

                // Remove off-screen enemies
                if (enemy.y > canvas.height + 100) {
                    enemies.splice(i, 1);
                }
            }

            // Update & Draw Player
            player.update(roadLeft, roadRight);
            player.draw();

            requestAnimationFrame(gameLoop);
        }

        // Start Game Handler
        function startGame() {
            initAudio();
            resetGame();
            isPlaying = true;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // Game Over Handler
        function handleGameOver() {
            isPlaying = false;
            playSound('crash');

            // Highscore Check
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_racer_highscore', highScore);
                highScoreValEl.textContent = Math.floor(highScore);
            }

            finalScoreEl.textContent = Math.floor(score);
            finalCoinsEl.textContent = coinsCollected;
            finalHighScoreEl.textContent = Math.floor(highScore);

            gameOverOverlay.classList.remove('hidden');
        }

        // Button Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Initial Canvas Render
        drawRoad();
    </script>
</body>
</html>
